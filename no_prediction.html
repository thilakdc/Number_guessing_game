<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number_prediction</title>
    <link rel="stylesheet" href="no_prediction.css">
</head>
<body>
    <header>
        <div class="title">
            <div>
                Guess My Number
            </div>
            <div>
                Between 1 And 100
            </div>
        </div>
    </header>
    <div class="centre">
        <label class="label1">Number :-</label>
        <input type="number" placeholder="Enter The Number Here" class="num" min="1" max="100" required>
    </div>
    <div class="submit">
        <button class="button">SUBMIT</button>
    </div>
    <div class="last">
        <div class="detail">
            Enter The Number
        </div>
    </div>
    
</body>
<script src="no_predictiion.js"></script>
</html>
